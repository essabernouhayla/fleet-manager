<header class="topbar">
  <a class="brand" routerLink="/vehicles">
    <img src="logo.svg" alt="Logo FleetManager" class="logo">
    <span>Fleet<b>Manager</b></span>
  </a>

  <nav>
    @if (auth.user(); as u) {
      <a routerLink="/vehicles" routerLinkActive="active">Véhicules</a>
      @if (u.role === 'MANAGER') {
        <a routerLink="/admin/maintenance" routerLinkActive="active">Administration</a>
      }
      <span class="user">{{ u.name }} <em class="role">{{ u.role }}</em></span>
      <button class="btn btn-gold" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Connexion</a>
    }
  </nav>
</header>

<main class="container">
  <router-outlet />
</main>
