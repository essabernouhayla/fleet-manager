<nav>
  @if (auth.user(); as u) {
    <span>{{ u.name }} — {{ u.role }}</span>
    <a routerLink="/vehicles">Véhicules</a>
    @if (u.role === 'MANAGER') {
      <a routerLink="/admin/maintenance">Administration</a>
    }
    <button (click)="logout()">Déconnexion</button>
  } @else {
    <a routerLink="/login">Connexion</a>
  }
</nav>

<router-outlet />
